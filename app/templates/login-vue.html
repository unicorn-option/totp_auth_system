<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - TOTP Auth System</title>
    <!-- 引入 Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- 引入共用 JavaScript 文件 -->
    <script src="/static/js/common.js"></script>
    <!-- 引入静态样式文件 -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="login-container" id="app">
        <h1>TOTP Auth System</h1>
        
        {%raw%}
        <form @submit.prevent="login">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" v-model="loginForm.username" required>
            </div>
            <div class="form-group">
                <label for="totp_code">动态密码</label>
                <input type="text" id="totp_code" v-model="loginForm.totp_code" required maxlength="6" pattern="[0-9]{6}">
            </div>
            <button type="submit" :disabled="loading">登录</button>
        </form>
        
        <div class="error-message" v-if="error">
            {{ error }}
        </div>
        
        <div class="loading" v-if="loading">
            <p>Loading...</p>
        </div>
        {%endraw%}
        
        <script>
            new Vue({
                el: '#app',
                data: {
                    loginForm: {
                        username: '',
                        totp_code: ''
                    },
                    error: '',
                    loading: false
                },
                methods: {
                    async login() {
                        this.loading = true;
                        this.error = '';
                        
                        try {
                            const result = await ApiUtils.login(
                                this.loginForm.username,
                                this.loginForm.totp_code
                            );
                            
                            // 根据用户角色重定向
                            window.location.href = result.redirectUrl;
                        } catch (error) {
                            this.error = error.message;
                        } finally {
                            this.loading = false;
                        }
                    }
                }
            });
        </script>
    </div>
</body>
</html>
